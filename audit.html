<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>壮壮肉铺 · 食安抽查打分器</title>
<style>
:root{--primary:#2f7d4f;--red:#c0392b;--bg:#f4f6f8;--card:#fff;--border:#e2e6ea;--gray:#6b7480;--dark:#1d2530;--amber:#b8860b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);color:var(--dark);padding-bottom:130px;}
.wrap{max-width:720px;margin:0 auto;padding:16px;}
header{padding:20px 16px 14px;background:linear-gradient(135deg,#2f7d4f,#39965f);color:#fff;}
header h1{font-size:19px;font-weight:600;}
header p{font-size:12.5px;opacity:.85;margin-top:4px;}
.meta{display:flex;gap:10px;margin-top:12px;}
.meta input{flex:1;padding:9px 10px;border:none;border-radius:8px;font-size:14px;background:rgba(255,255,255,.92);}
.core-tip{margin:12px 0 0;padding:9px 12px;border-radius:8px;background:rgba(255,255,255,.15);font-size:12.5px;line-height:1.6;}
.sec{background:var(--card);border-radius:12px;margin-top:12px;overflow:hidden;border:1px solid var(--border);}
.sec-title{padding:11px 14px;font-size:14px;font-weight:600;background:#eef5f0;color:var(--primary);display:flex;justify-content:space-between;}
.sec-title small{font-weight:400;color:var(--gray);}
.item{padding:12px 14px;border-top:1px solid var(--border);}
.item-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pt{font-size:11px;padding:1px 7px;border-radius:10px;background:#e8edf1;color:var(--gray);font-weight:400;}
.pt.big{background:#fdeede;color:#b05e0f;}
.red-tag{font-size:11px;padding:1px 7px;border-radius:10px;background:#fbe4e4;color:var(--red);font-weight:600;}
.star{color:#b05e0f;font-size:13px;}
.std{font-size:12.5px;color:var(--gray);margin-top:4px;line-height:1.55;}
.btns{display:flex;gap:8px;margin-top:9px;}
.btns button{flex:1;padding:8px 0;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;color:var(--gray);}
.btns button.on-pass{border-color:var(--primary);background:#e9f5ee;color:var(--primary);font-weight:600;}
.btns button.on-fail{border-color:var(--red);background:#fdecec;color:var(--red);font-weight:600;}
.btns button.on-skip{border-color:#4a5566;background:#4a5566;color:#fff;font-weight:600;}
.ded-list{margin-top:5px;font-size:12.5px;color:var(--red);line-height:1.5;}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.07);padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
.bar-in{max-width:720px;margin:0 auto;}
.stats{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--gray);}
.rate{font-size:26px;font-weight:700;color:var(--dark);}
.grade{font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:#e8edf1;}
.grade.g-ok{background:#e9f5ee;color:var(--primary);}
.grade.g-pass{background:#fdeede;color:#b05e0f;}
.grade.g-bad{background:#fdecec;color:var(--red);}
.copybtn{margin-top:10px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;}
.copybtn:active{transform:scale(.99);}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(29,37,48,.9);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.rule{font-size:12px;color:var(--gray);margin-top:2px;}
</style>
</head>
<body>
<header>
  <h1>壮壮肉铺 · 食安抽查打分器</h1>
  <p>V3.9 · 看见什么查什么，按实查项算得分率</p>
  <div class="meta">
    <input id="m-date" type="date">
    <input id="m-name" placeholder="检查人（选填）">
  </div>
  <div class="core-tip">★ = 每次必查核心组（红线 4 项 + 帽式头套 + 出餐照片）。其余项见了就打，不见不勉强。</div>
</header>
<div class="wrap" id="list"></div>
<div class="bar"><div class="bar-in">
  <div class="stats" id="stats">请开始标记检查项</div>
  <button class="copybtn" id="copy">复制抽查结果</button>
</div></div>
<div class="toast" id="toast">已复制</div>
<script>
const CORE = new Set([1,2,4,8,11,17]);
const DATA = [
 {sec:'一、食材与效期',sum:'2 条红线',items:[
  {no:1,name:'原料效期',std:'到货剩余保质期 ≥1/3；超硬性效期仍在用 → 一票否决（腌肉5天/菜原料3天/沙拉碗当天现备/Pro碗腌菜1天/叶菜当天/虾仁解冻当天）',pts:0,red:true,redDesc:'超硬性效期仍在用 → 一票否决'},
  {no:2,name:'隔夜食材复检',std:'前晚切好/腌好的菜、解冻的虾，用前必复检：蔫软、发黄发暗、发粘、异味不用',pts:0,red:true,redDesc:'未复检/用异常食材 → 一票否决'},
 ]},
 {sec:'二、储存',sum:'5 分',items:[
  {no:3,name:'冰箱温度',std:'冷藏 0~4°C，冷冻 ≤-18°C，现场实测',pts:5},
 ]},
 {sec:'三、人员',sum:'30 分',items:[
  {no:4,name:'帽式头套',std:'罩住所有头发含鬓角碎发',pts:10},
  {no:5,name:'手部',std:'无首饰、指甲短、碰生肉后洗手；洗手池有洗手液出水正常',pts:5},
  {no:6,name:'健康证',std:'在有效期内，与在岗人员一致',pts:5},
  {no:7,name:'禁烟',std:'店内任何区域无烟头、烟灰缸、吸烟痕迹',pts:10},
 ]},
 {sec:'四、加工与出餐',sum:'25 分 + 2 条红线',items:[
  {no:8,name:'出餐检查',std:'装盒前目视：菜叶中有无虫/泥沙、有无毛发等异物、颜色/包装。发现虫/泥沙/异物 → 一票否决；流程没执行 → 扣 15 分',pts:15,red:true,redDesc:'餐品中发现虫/泥沙/异物 → 一票否决'},
  {no:9,name:'生肉处理',std:'切完生肉：刀、砧板、手洗净再碰其他；砧板刀具无裂缝发霉',pts:5},
  {no:10,name:'出餐时效',std:'装盒后 30 分钟内出餐/进保温袋',pts:5},
  {no:11,name:'熟度',std:'肉禽、虾全熟：无血水、肉色不透明',pts:0,red:true,redDesc:'未全熟 → 一票否决'},
 ]},
 {sec:'五、环境与器具',sum:'25 分',items:[
  {no:12,name:'台面',std:'无积水污渍；抹布分用定期换',pts:5},
  {no:13,name:'保温箱',std:'罩子完好干净，箱内无污渍异味',pts:5},
  {no:14,name:'垃圾桶',std:'加盖、日产日清、不外溢、桶身干净',pts:5},
  {no:15,name:'洗手池',std:'池边龙头无发霉发黑发臭；有洗手液、出水正常',pts:5},
  {no:16,name:'地面',std:'无水渍油渍，随手拖干',pts:5},
 ]},
 {sec:'六、留档',sum:'20 分',items:[
  {no:17,name:'出餐照片',std:'水印相机当日留档（防碰瓷自证）',pts:10},
  {no:18,name:'批次留样',std:'到货重点原料留样贴日期；每炉/每班成品留一盒贴日期；一袋用完再开新袋；冷藏 48h 到期丢弃',pts:10,dedNote:'缺生样 -10 / 缺熟样 -10'},
 ]},
];
const state = {}; // no -> 'pass'|'fail'|'skip'   红线项 fail = 触发红线
DATA.forEach(s=>s.items.forEach(i=>state[i.no]=null));
const listEl = document.getElementById('list');
DATA.forEach(sec=>{
  const box = document.createElement('div'); box.className='sec';
  box.innerHTML = `<div class="sec-title"><span>${sec.sec}</span><small>${sec.sum}</small></div>`;
  sec.items.forEach(it=>{
    const d = document.createElement('div'); d.className='item';
    d.innerHTML = `
      <div class="item-name">${CORE.has(it.no)?'<span class="star">★</span>':''}${it.no}. ${it.name}
        ${it.red?'<span class="red-tag">红线</span>':''}${it.redLabel?`<span class="red-tag">${it.redLabel}</span>`:''}
        ${it.pts?`<span class="pt big">扣 ${it.pts}</span>`:''}
      </div>
      <div class="std">${it.std}${it.redDesc?`<br><b style="color:var(--red)">${it.redDesc}</b>`:''}</div>
      <div class="btns" data-no="${it.no}">
        <button data-v="pass">${it.red?'未见违规':'通过'}</button>
        <button data-v="fail">${it.red?'触发红线':'违规'}</button>
        <button data-v="skip">未查</button>
      </div>
      <div class="ded-list" id="ded-${it.no}"></div>`;
    box.appendChild(d);
  });
  listEl.appendChild(box);
});
document.querySelectorAll('.item').forEach(item=>{
  const no = +item.querySelector('.btns').dataset.no;
  const btns = item.querySelectorAll('.btns button');
  btns.forEach(b=>b.addEventListener('click',()=>{
    const v = b.dataset.v;
    state[no] = (state[no]===v) ? null : v;
    btns.forEach(x=>x.classList.remove('on-pass','on-fail','on-skip'));
    if(state[no]) b.classList.add(state[no]==='pass'?'on-pass':state[no]==='fail'?'on-fail':'on-skip');
    calc();
  }));
});
const allItems = DATA.flatMap(s=>s.items);
function findItem(no){return allItems.find(i=>i.no===no);}
function calc(){
  let earns=0, ded=0, checked=0, fails=[], redHit=null;
  allItems.forEach(it=>{
    const st = state[it.no];
    if(st==='pass'){checked++;}
    else if(st==='fail'){
      checked++;
      if(it.red){redHit = it.redDesc || '触发红线';}
      else{earns+=it.pts;ded+=it.pts;fails.push(`${it.no}.${it.name} -${it.pts}`);}
      const box=document.getElementById('ded-'+it.no); if(box) box.textContent = it.red?(it.redDesc||'触发红线'):(it.dedNote||(`扣 ${it.pts} 分`)); else if(box)box.textContent='';
    } else if(st==='skip'){checked++;}
    else {const box=document.getElementById('ded-'+it.no); if(box) box.textContent='';}
    if(st==='pass'||st==='skip'){const box=document.getElementById('ded-'+it.no); if(box) box.textContent='';}
    if(st==='pass' && !it.red) earns += it.pts;
  });
  const coreMissing = [...CORE].filter(no=>!state[no]).length;
  const st = document.getElementById('stats');
  if(checked===0){st.innerHTML='请开始标记检查项';return;}
  let rate, grade, gcls;
  if(redHit){rate=0;grade='触发红线：停业整改';gcls='g-bad';}
  else if(earns===0){st.innerHTML='当前实查项均为红线项，请再查一些计分项';return;}
  else{
    rate = (earns-ded)/earns*100;
    grade = rate>=90?'优':rate>=80?'合格':rate>=70?'一周内整改':'停业整改';
    gcls = rate>=90?'g-ok':rate>=80?'g-pass':rate>=70?'g-pass':'g-bad';
  }
  st.innerHTML = `<span class="rate">${rate.toFixed(0)}%</span><span class="grade ${gcls}">${grade}</span>
    <span>实查 ${checked} 项 · 应得 ${earns} · 已扣 ${ded}</span>
    ${coreMissing?`<span style="color:var(--amber)">⚠ 核心组未查 ${coreMissing} 项</span>`:`<span style="color:var(--primary)">核心组已查齐</span>`}`;
  window.__result = {checked,earns,ded,fails,redHit,rate,grade,coreMissing};
}
document.getElementById('copy').addEventListener('click',()=>{
  const r = window.__result;
  if(!r){toast('还没有检查结果');return;}
  const dateEl = document.getElementById('m-date');
  const name = document.getElementById('m-name').value;
  const dt = dateEl.value ? dateEl.value : new Date().toISOString().slice(0,10);
  const lines = [
    '【食安抽查 · 壮壮肉铺】',
    `日期：${dt}` + (name?` · 检查人：${name}`:''),
    `实查：${r.checked} 项（应得 ${r.earns} 分，扣 ${r.ded} 分）`,
  ];
  if(r.redHit) lines.push(`红线触发：${r.redHit}`);
  else if(r.fails.length) lines.push(`扣分项：${r.fails.join('；')}`);
  else lines.push('扣分项：无');
  lines.push(`得分率：${r.rate.toFixed(0)}% → ${r.grade}`);
  if(r.coreMissing) lines.push(`备注：核心组尚有 ${r.coreMissing} 项未查`);
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('已复制，可粘贴')).catch(()=>fallback(text));
  } else fallback(text);
  function fallback(t){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('已复制，可粘贴');}catch(e){toast('复制失败，请截图');}
    ta.remove();
  }
});
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
document.getElementById('m-date').value = new Date().toISOString().slice(0,10);
calc();
</script>
</body>
</html>
